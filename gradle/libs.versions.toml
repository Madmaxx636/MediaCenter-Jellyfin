[versions]
agp = "9.4.0"
kotlin = "2.3.21"
kotlinCoroutines = "1.11.0"
serialization = "1.11.0"
core = "1.19.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
compose = "2026.09.00"
media3 = "1.11.1"
coil = "3.6.2"
ktor = "3.5.2"

[libraries]
androidx-core = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version = "1.4.1" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinCoroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-ui-compose = { module = "androidx.media3:media3-ui-compose", version.ref = "media3" }
# Jellyfin's prebuilt FFmpeg audio decoder for Media3 (DTS, TrueHD, Dolby Digital, ALAC... in software).
media3-ffmpeg = { module = "org.jellyfin.media3:media3-ffmpeg-decoder", version = "1.9.0+1" }
# FFmpeg video decoding in the app (AV1 through dav1d, MPEG-2, and more) where the TV has no decoder; GPL-3.0.
# Its version follows Media3's.
media3-ffmpeg-video = { module = "io.github.anilbeesetti:nextlib-media3ext", version = "1.11.1-0.16.0" }
# libass for Media3: ASS/SSA subtitles with their own fonts, colours and positions (MIT).
media3-ass = { module = "io.github.peerless2012:ass-media", version = "0.5.1" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

[bundles]
compose = ["compose-ui", "compose-foundation", "compose-ui-tooling-preview"]
media3 = ["media3-exoplayer", "media3-exoplayer-hls", "media3-ui-compose", "media3-ffmpeg", "media3-ffmpeg-video", "media3-ass"]
coil = ["coil-compose", "coil-network"]
ktor = ["ktor-client-core", "ktor-client-okhttp", "ktor-client-content-negotiation", "ktor-serialization-json"]

[plugins]
android = { id = "com.android.application", version.ref = "agp" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
